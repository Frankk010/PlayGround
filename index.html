<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moba Legends: Rift Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110f;color:#ecfff7;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 18px;border:1px solid #a4ffe055;border-radius:16px;background:#071411cc;box-shadow:0 8px 30px #0008;backdrop-filter:blur(8px)}

.ability{pointer-events:auto;width:74px;height:74px;border:2px solid #759b91;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 30%,#24483e,#0b1714);box-shadow:0 5px 16px #000b;color:white;text-align:center}.ability.active{border-color:#aef8df}.ability kbd{position:absolute;right:5px;bottom:3px;width:18px;height:18px;border-radius:50%;background:#06110e;font-size:10px;line-height:18px}.ability .icon{font-size:24px;margin-top:12px}.ability .name{font-size:9px;color:#bdd7ce}.cool{position:absolute;inset:0;border-radius:50%;display:none;align-items:center;justify-content:center;background:#050907aa;font-size:20px;font-weight:900}
#stick{position:absolute;left:28px;bottom:30px;width:125px;height:125px;border-radius:50%;border:2px solid #b9dacd22;background:#8dbcae12;display:none}#knob{position:absolute;left:38px;top:38px;width:49px;height:49px;border-radius:50%;background:#a2d0c555;border:2px solid #c7eee0aa}
#attack{display:none;position:absolute;right:25px;bottom:36px;width:86px;height:86px;border-radius:50%;border:2px solid #ffc8a866;background:#ef6b5133;font-size:32px;color:#fff;text-align:center;line-height:82px}.atkcd{position:absolute;inset:0;border-radius:50%;background:#05090799;line-height:86px;display:none}
#toast{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-weight:900;font-size:26px;text-align:center;text-shadow:0 3px 12px #000;opacity:0;transition:.25s}#toast.show{opacity:1}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#18382fbb,#07100eee);z-index:5}#card{width:min(520px,86vw);text-align:center;border:1px solid #9bcbbbaa;border-radius:24px;padding:28px;background:#0c1d18dd;box-shadow:0 24px 80px #000}h1{margin:0;font-size:43px;letter-spacing:-2px}h1 span{color:#71e9bd}.sub{color:#a9c3ba;margin:8px 0 22px}.pick{display:flex;gap:12px;justify-content:center}.hero{width:145px;border:1px solid #8ab0a5;border-radius:16px;padding:12px;background:#132822;cursor:pointer}.hero:hover{transform:translateY(-3px);border-color:#b6ffe3}.avatar{width:74px;height:74px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid #94d7c2;background:#1e493e}.hero strong{display:block;margin-top:7px}.hero small{color:#9ab9af}.hero.selected{border-color:#ffe092;box-shadow:0 0 24px #ffe09233}
button#play{margin-top:20px;border:0;border-radius:999px;padding:13px 42px;background:linear-gradient(90deg,#58cda2,#9cead0);color:#092018;font-weight:900;font-size:17px;cursor:pointer}
@media(max-width:700px),(pointer:coarse){#minimap{width:110px;height:110px}#stats{top:10px}#top{top:8px}#abilities{bottom:16px}.ability{width:58px;height:58px}.ability .icon{margin-top:7px;font-size:20px}.ability .name{display:none}.ability kbd{display:none}#stick,#attack{display:block}#xpbar{bottom:84px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="stats"></div><canvas id="minimap" width="152" height="152"></canvas><div id="top"><span class="blue score" id="bs">0</span><div class="timer" id="timer">03:00</div><span class="red score" id="rs">0</span></div><div id="xpbar"><i id="xpfill"></i></div><div id="abilities"><div class="ability active" data-a="0"><div class="icon">⚔</div><div class="name">Strike</div><kbd>Q</kbd><div class="cool"></div></div><div class="ability" data-a="1"><div class="icon">💨</div><div class="name">Dash</div><kbd>W</kbd><div class="cool"></div></div><div class="ability" data-a="2"><div class="icon">🌿</div><div class="name">Blast</div><kbd>E</kbd><div class="cool"></div></div><div class="ability" data-a="3"><div class="icon">★</div><div class="name">Ultimate</div><kbd>R</kbd><div class="cool"></div></div></div><div id="stick"><div id="knob"></div></div><div id="attack">⚔<div class="atkcd"></div></div><div id="toast"></div></div>
<div id="start"><div id="card"><h1>Moba <span>Legends</span></h1><div class="sub">RIFT ARENA · FIRST TO 40 SCORE WINS</div><div class="pick"><div class="hero selected" data-hero="0"><div class="avatar">🛡️</div><strong>KAEL</strong><small>Balanced guardian</small></div><div class="hero" data-hero="1"><div class="avatar">🏹</div><strong>LYRA</strong><small>Fast ranger</small></div><div class="hero" data-hero="2"><div class="avatar">🪄</div><strong>AZRA</strong><small>Arcane mage</small></div></div><button id="play">ENTER THE RIFT</button></div></div>
<script>
(()=>{'use strict';
const canvas=$('#c'),ctx=canvas.getContext('2d'),mm=$('#minimap'),mctx=mm.getContext('2d');function $(q){return document.querySelector(q)}
let W,H,DPR=Math.min(2,devicePixelRatio||1),running=false,heroChoice=0,last=performance.now(),time=180,matchOver=false;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const world={w:2200,h:2200,baseB:{x:180,y:180},baseR:{x:2020,y:2020}};
const heroData=[{n:'Kael',hp:520,spd:230,dmg:48,color:'#55baff',icon:'🛡️'},{n:'Lyra',hp:420,spd:260,dmg:42,color:'#55c9ff',icon:'🏹'},{n:'Azra',hp:390,spd:245,dmg:58,color:'#55c9ff',icon:'🪄'}];
let player={team:'b',x:300,y:300,r:24,hp:520,max:520,spd:230,dmg:48,lv:1,xp:0,next:100,gold:500,respawn:0,regen:3,angle:-.7,cd:[0,0,0,0],dash:0,shield:0,ult:0,icon:'🛡️',name:'You'},keys={},mouse={x:0,y:0,down:false},units=[],effects=[],particles=[],projectiles=[],camps=[];
function makePlayer(){let d=heroData[heroChoice];player={team:'b',x:300,y:300,r:24,hp:d.hp,max:d.hp,spd:d.spd,dmg:d.dmg,lv:1,xp:0,next:100,gold:500,respawn:0,regen:3,angle:-.7,color:d.color,cd:[0,0,0,0],dash:0,shield:0,ult:0,icon:d.icon};camera.x=player.x-W/2;camera.y=player.y-H/2}
let camera={x:0,y:0};
function unit(team,x,y,kind='minion'){let h=kind==='hero'?520:kind==='turret'?1800:kind==='super'?700:250;let u={team,x,y,r:kind==='turret'?40:kind==='hero'?24:16,hp:h,max:h,dmg:kind==='turret'?75:kind==='super'?38:22,spd:kind==='hero'?180:70,kind,angle:0,respawn:0,cd:1+Math.random(),target:null,hit:0};units.push(u);return u}
function reset(){units=[];projectiles=[];effects=[];particles=[];camps=[];makePlayer();
unit('b',220,220,'hero');units[0].team='b';units[0].name='You';player=units[0];Object.assign(player,{name:'You',hp:heroData[heroChoice].hp,max:heroData[heroChoice].hp,dmg:heroData[heroChoice].dmg,spd:heroData[heroChoice].spd,icon:heroData[heroChoice].icon,gold:500,lv:1,xp:0,next:100,cd:[0,0,0,0],respawn:0,regen:3,shield:0,dash:0,ult:0,angle:-.7});
// enemies
unit('r',1980,1980,'hero');Object.assign(units[1],{name:'VEX',hp:500,max:500,dmg:42,spd:190,ai:true});
// fixed turrets and bases
[{team:'b',x:430,y:430},{team:'b',x:720,y:720},{team:'b',x:1050,y:1050},{team:'r',x:1770,y:1770},{team:'r',x:1490,y:1490},{team:'r',x:1150,y:1150}].forEach(t=>unit(t.team,t.x,t.y,'turret'));
for(let i=0;i<12;i++){let a=i/12*Math.PI*2,r=480+Math.random()*180;camps.push({x:1100+Math.cos(a)*r,y:1100+Math.sin(a)*r,hp:180,max:180,respawn:0,kind:i%3===0?'dragon':'camp'})}
time=180;matchOver=false;$('#start').style.display='none';running=true;toast('RIFT OPEN')} 
function spawnWave(team){for(let i=0;i<4;i++){let base=team=='b'?{x:230,y:260}:{x:1970,y:1940};let u=unit(team,base.x+i*22,base.y+i*22,'minion');u.team=team}}
let wave=0;setInterval(()=>{if(running&&!matchOver){spawnWave('b');spawnWave('r');wave++}},10000);
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function enemyNearest(u,max=650){let best=null,bestd=max;for(let v of units){if(v.team!==u.team&&v.hp>0){let d=dist(u,v);if(d<bestd){best=v;bestd=d}}}return best}
function shoot(a,b,damage,speed=500,color='#dfffee',life=1.2){projectiles.push({x:a.x,y:a.y,vx:(b.x-a.x)/Math.max(1,dist(a,b))*speed,vy:(b.y-a.y)/Math.max(1,dist(a,b))*speed,r:5,team:a.team,dmg:damage,color,life})}
function damage(v,d,src){if(v.hp<=0)return;if(v.shield>0){let n=Math.min(v.shield,d);v.shield-=n;d-=n}v.hp-=d;if(v.team!='b'||v.kind==='turret'){}if(v.hp<=0){kill(v,src)}}
function kill(v,src){v.hp=0;if(v.kind==='hero'){v.respawn=12;v.gold=Math.max(0,(v.gold||0)-100);if(src&&src.team=='b')player.gold+=180;if(src&&src.team=='r'){};toast(v.team=='r'?'ENEMY ELIMINATED':'YOU WERE ELIMINATED');}else{if(src&&src.team=='b'&&v.team=='r'){player.gold+=v.kind==='turret'?250:v.kind==='super'?40:12}if(src&&src.team=='r'&&v.team=='b'){};burst(v.x,v.y,v.team=='r'?'#ff6680':'#67baff',18)} }
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*0.6,color,r:2+Math.random()*4})}}
function useAbility(i){if(matchOver||player.hp<=0)return;let cd=[5,7,9,18][i];if(player.cd[i]>0)return;let mx=(mouse.x||W/2),my=(mouse.y||H/2);let wx=camera.x+mx,wy=camera.y+my,tx=clamp(wx,0,world.w),ty=clamp(wy,0,world.h);player.cd[i]=cd;
if(i==0){let t=enemyNearest(player,190);if(t){damage(t,player.dmg*(1+player.lv*.06),player);burst(t.x,t.y,'#ffe6a3',10)}else burst(tx,ty,'#ffe6a3',5)}
if(i==1){let a=Math.atan2(ty-player.y,tx-player.x);player.dash=70;player.vdx=Math.cos(a);player.vdy=Math.sin(a);effects.push({x:player.x,y:player.y,r:20,life:.25,color:'#9eeeff'})}
if(i==2){let a=Math.atan2(ty-player.y,tx-player.x);for(let k=0;k<5;k++)projectiles.push({x:player.x,y:player.y,vx:Math.cos(a+(k-2)*.12)*430,vy:Math.sin(a+(k-2)*.12)*430,r:7,team:'b',dmg:35+player.lv*5,color:'#77ffbb',life:1.2});burst(player.x,player.y,'#77ffbb',12)}
if(i==3){player.shield+=220;player.ult=5;burst(player.x,player.y,'#fff0a8',25);toast('DIVINE OVERTURE')}
}
function update(dt){if(!running)return;time-=dt;if(time<=0){endMatch('MATCH COMPLETE')}
for(let i=0;i<4;i++)player.cd[i]=Math.max(0,player.cd[i]-dt);
if(player.respawn>0){player.respawn-=dt;if(player.respawn<=0){player.x=300;player.y=300;player.hp=player.max}}
else{let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(joy.active){dx=joy.dx;dy=joy.dy}let l=Math.hypot(dx,dy)||1;if(l>1){dx/=l;dy/=l}if(player.dash>0){player.dash-=dt*90;dx=player.vdx;dy=player.vdy}let ns=player.spd*(keys.Shift?1.45:1);player.x=clamp(player.x+dx*ns*dt,30,world.w-30);player.y=clamp(player.y+dy*ns*dt,30,world.h-30);if(l||player.dash>0)player.angle=Math.atan2(dy,dx);player.hp=Math.min(player.max,player.hp+player.regen*dt);if(player.ult>0){player.ult-=dt;let t=enemyNearest(player,180);if(t&&Math.random()<dt*5)damage(t,18,player)}}
for(let u of units){if(u===player||u.hp<=0)continue;if(u.kind==='hero'&&u.ai){let t=enemyNearest(u,700);if(t){if(dist(u,t)>150){u.x+=clamp(t.x-u.x,-1,1)*u.spd*dt;u.y+=clamp(t.y-u.y,-1,1)*u.spd*dt}else if(Math.random()<dt*.8)shoot(u,t,u.dmg)}}else if(u.kind==='minion'){let base=u.team=='b'?world.baseR:world.baseB,t=enemyNearest(u,150);if(t){if(dist(u,t)>28){}else damage(t,u.dmg*dt*1.8,u)}else{let dx=base.x-u.x,dy=base.y-u.y,l=Math.hypot(dx,dy)||1;if(l>20){u.x+=dx/l*u.spd*dt;u.y+=dy/l*u.spd*dt}}}else if(u.kind==='turret'){let t=enemyNearest(u,260);if(t&&t.team!==u.team){u.cd-=dt;if(u.cd<=0){shoot(u,t,u.dmg,650,'#ffcf71',1);u.cd=1}}}
}
for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){projectiles.splice(i,1);continue}for(let u of units){if(u.team!==p.team&&u.hp>0&&dist(p,u)<u.r+p.r){damage(u,p.dmg,p);burst(p.x,p.y,p.color,5);projectiles.splice(i,1);break}}}
for(let c of camps){if(c.respawn>0){c.respawn-=dt;if(c.respawn<=0)c.hp=c.max}else if(c.hp<=0)c.respawn=25}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=effects.length-1;i>=0;i--){effects[i].life-=dt;effects[i].r+=dt*180;if(effects[i].life<=0)effects.splice(i,1)}
// XP nearby enemy kills handled simply
if(player.xp>=player.next){player.lv++;player.xp-=player.next;player.next=Math.round(player.next*1.35);player.max+=50;player.hp+=50;player.dmg+=5;toast('LEVEL '+player.lv)}
// base score by eliminations approximated through gold milestones
if(player.gold>=5000){}camera.x+=(player.x-W/2-camera.x)*.12;camera.y+=(player.y-H/2-camera.y)*.12;camera.x=clamp(camera.x,0,world.w-W);camera.y=clamp(camera.y,0,world.h-H);
}
function endMatch(txt){matchOver=true;toast(txt);setTimeout(()=>{$('#start').style.display='flex';$('#start h1').innerHTML='MATCH <span>COMPLETE</span>';$('#play').textContent='PLAY AGAIN'},700)}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);
// terrain
ctx.fillStyle='#18372f';ctx.fillRect(0,0,world.w,world.h);ctx.fillStyle='#1d4639';for(let x=0;x<world.w;x+=180)for(let y=0;y<world.h;y+=180){ctx.beginPath();ctx.arc(x+90,y+90,58,0,7);ctx.fill()}ctx.strokeStyle='#79a99a22';ctx.lineWidth=2;for(let x=0;x<world.w;x+=180){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=180){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
// river and paths
ctx.fillStyle='#123b42';ctx.beginPath();ctx.moveTo(0,850);ctx.bezierCurveTo(650,1050,1550,900,2200,1350);ctx.lineTo(2200,1500);ctx.bezierCurveTo(1500,1080,700,1200,0,1000);ctx.closePath();ctx.fill();ctx.strokeStyle='#63a4a544';ctx.lineWidth=4;ctx.stroke();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(1100,1100);ctx.lineTo(2000,2000);ctx.stroke();ctx.beginPath();ctx.moveTo(200,2000);ctx.lineTo(2000,200);ctx.stroke();
// camps
for(let c of camps){if(c.respawn>0)continue;ctx.fillStyle=c.kind==='dragon'?'#d96a58':'#6baa63';ctx.beginPath();ctx.arc(c.x,c.y,20,0,7);ctx.fill();ctx.fillStyle='#cde9c5';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(c.kind==='dragon'?'♨':'♧',c.x,c.y+7)}
// bases
for(let b of [world.baseB,world.baseR]){let red=b===world.baseR;ctx.fillStyle=red?'#642537':'#174b62';ctx.beginPath();ctx.arc(b.x,b.y,110,0,7);ctx.fill();ctx.fillStyle=red?'#ff607c':'#66bbff';ctx.beginPath();ctx.arc(b.x,b.y,58,0,7);ctx.fill();ctx.fillStyle='#102018';ctx.beginPath();ctx.arc(b.x,b.y,28,0,7);ctx.fill()}
for(let u of units){if(u.hp<=0)continue;if(u.kind==='turret'){ctx.fillStyle=u.team=='b'?'#74bdc9':'#be616e';ctx.fillRect(u.x-32,u.y-32,64,64);ctx.fillStyle='#192621';ctx.fillRect(u.x-20,u.y-20,40,40);ctx.fillStyle=u.team=='b'?'#91e6f1':'#ff9ca6';ctx.beginPath();ctx.arc(u.x,u.y,12,0,7);ctx.fill()}else{ctx.fillStyle=u.team=='b'?'#55baff':'#ff5d74';ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,7);ctx.fill();ctx.fillStyle='#eafff8';ctx.beginPath();ctx.arc(u.x-u.r*.3,u.y-u.r*.32,u.r*.22,0,7);ctx.fill();if(u.kind==='hero'){ctx.strokeStyle=u.team=='b'?'#c3efff':'#ffd0d4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x,u.y,u.r+5,0,7);ctx.stroke();ctx.fillStyle='#07120f';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(u.name||u.team.toUpper(),u.x,u.y-u.r-10)}}
 if(u.hp<u.max){ctx.fillStyle='#182018';ctx.fillRect(u.x-u.r,u.y-u.r-10,u.r*2,5);ctx.fillStyle=u.team=='b'?'#62cfff':'#ff6e82';ctx.fillRect(u.x-u.r,u.y-u.r-10,u.r*2*(u.hp/u.max),5)}}
for(let p of projectiles){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}for(let e of effects){ctx.strokeStyle=e.color||'#fff';ctx.globalAlpha=e.life/.25;ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();ctx.globalAlpha=1}for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
// minimap

$('#stats').innerHTML=`<b>${heroData[heroChoice].n}</b> · LV <b>${player.lv}</b><br>HP <b>${Math.ceil(player.hp)}</b> / ${player.max}<br>GOLD <b>${player.gold}</b><br>XP <b>${Math.floor(player.xp)}</b> / ${player.next}`;

function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

let joy={active:false,dx:0,dy:0};let stick=$('#stick'),knob=$('#knob');stick.addEventListener('pointerdown',e=>{joy.active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(joy.active)moveStick(e)});stick.addEventListener('pointerup',()=>{joy.active=false;joy.dx=0;joy.dy=0;knob.style.transform=''});function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),m=38;if(l>m){dx=dx/l*m;dy=dy/l*m}knob.style.transform=`translate(${dx}px,${dy}px)`;joy.dx=dx/m;joy.dy=dy/m}
